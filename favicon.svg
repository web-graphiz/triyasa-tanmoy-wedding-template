<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Royal Blue to Dusty Slate Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e304c" />
      <stop offset="50%" stop-color="#3c5e8c" />
      <stop offset="100%" stop-color="#648cbe" />
    </linearGradient>

    <!-- Metallic Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1be" />
      <stop offset="25%" stop-color="#e8c15a" />
      <stop offset="50%" stop-color="#c99726" />
      <stop offset="75%" stop-color="#fae392" />
      <stop offset="100%" stop-color="#9e721d" />
    </linearGradient>

    <!-- Warm Highlight Gold -->
    <linearGradient id="goldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5b842" />
      <stop offset="50%" stop-color="#fff7d6" />
      <stop offset="100%" stop-color="#d4a737" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffd700" flood-opacity="0.3" />
    </filter>
    
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Medallion / Background (Rounded Squircle for tab visibility) -->
  <rect x="18" y="18" width="476" height="476" rx="120" ry="120" fill="url(#bgGrad)" />

  <!-- Outer Fine Filigree Border -->
  <rect x="27" y="27" width="458" height="458" rx="112" ry="112" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.45" />
  
  <!-- Main Rich Gold Border -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  
  <!-- Inner Fine Gold Border -->
  <rect x="48" y="48" width="416" height="416" rx="92" ry="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.7" />

  <!-- Inner Beaded Accents (Corner flourishes) -->
  <circle cx="58" cy="58" r="6" fill="url(#goldBright)" />
  <circle cx="454" cy="58" r="6" fill="url(#goldBright)" />
  <circle cx="58" cy="454" r="6" fill="url(#goldBright)" />
  <circle cx="454" cy="454" r="6" fill="url(#goldBright)" />

  <!-- Subtle Mandala / Radial Rosette in background -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5" fill="none" transform="translate(256, 260)">
    <circle r="140" stroke-dasharray="4,6" />
    <circle r="110" />
    <circle r="75" stroke-dasharray="3,5" />
    <path d="M0,-140 L0,140 M-140,0 L140,0 M-99,-99 L99,99 M-99,99 L99,-99" />
  </g>

  <!-- Royal Crown Crest (Centered at top) -->
  <g filter="url(#goldGlow)" transform="translate(256, 116)">
    <!-- Crown Base Band -->
    <path d="M-55,16 C-20,21 20,21 55,16 L52,24 C20,28 -20,28 -52,24 Z" fill="url(#goldGrad)" />
    <!-- Crown Band Jewels -->
    <circle cx="-34" cy="21" r="2.5" fill="#ffffff" />
    <circle cx="0" cy="23" r="3" fill="#e0304a" />
    <circle cx="34" cy="21" r="2.5" fill="#ffffff" />
    <!-- Crown Peaks / Spikes -->
    <path d="M-52,16 L-48,-14 L-24,3 L0,-24 L24,3 L48,-14 L52,16 C20,20 -20,20 -52,16 Z" fill="url(#goldBright)" />
    <!-- Crown Jewels on Peaks -->
    <circle cx="-48" cy="-15" r="4.5" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" />
    <circle cx="0" cy="-26" r="6.5" fill="url(#goldGrad)" stroke="#fff" stroke-width="1.2" />
    <circle cx="48" cy="-15" r="4.5" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" />
    <circle cx="-24" cy="2" r="3.5" fill="url(#goldGrad)" />
    <circle cx="24" cy="2" r="3.5" fill="url(#goldGrad)" />
    <!-- Auspicious Celestial Star above crown -->
    <path d="M0,-42 L3,-34 L11,-31 L3,-28 L0,-20 L-3,-28 L-11,-31 L-3,-34 Z" fill="#fffbe0" />
    <circle cx="0" cy="-31" r="2" fill="#ffffff" />
  </g>

  <!-- Golden Laurel / Floral Wreath hugging the monogram -->
  <g filter="url(#subtleShadow)" fill="url(#goldGrad)" opacity="0.9">
    <!-- Left Branch Leaves -->
    <path d="M125,230 Q110,225 105,205 Q120,210 125,230 Z" />
    <path d="M110,270 Q95,268 88,250 Q105,250 110,270 Z" />
    <path d="M108,315 Q92,320 85,302 Q102,298 108,315 Z" />
    <path d="M122,360 Q108,372 100,355 Q115,348 122,360 Z" />
    <path d="M152,400 Q140,418 128,405 Q140,392 152,400 Z" />
    <path d="M195,430 Q188,450 172,440 Q180,425 195,430 Z" />
    <!-- Left Stem Arc -->
    <path d="M115,210 Q90,320 205,440" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Right Branch Leaves -->
    <path d="M387,230 Q402,225 407,205 Q392,210 387,230 Z" />
    <path d="M402,270 Q417,268 424,250 Q407,250 402,270 Z" />
    <path d="M404,315 Q420,320 427,302 Q410,298 404,315 Z" />
    <path d="M390,360 Q404,372 412,355 Q397,348 390,360 Z" />
    <path d="M360,400 Q372,418 384,405 Q372,392 360,400 Z" />
    <path d="M317,430 Q324,450 340,440 Q332,425 317,430 Z" />
    <!-- Right Stem Arc -->
    <path d="M397,210 Q422,320 307,440" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Bottom Ribbon / Auspicious Knot -->
    <circle cx="256" cy="438" r="8" fill="url(#goldBright)" />
    <circle cx="256" cy="438" r="3" fill="#ffffff" />
    <path d="M256,438 Q235,451 220,444 Q235,434 256,438 Z" />
    <path d="M256,438 Q277,451 292,444 Q277,434 256,438 Z" />
  </g>

  <!-- Central Royal Monogram: T & T -->
  <g filter="url(#goldGlow)">
    <!-- First 'T' (Triyasa) -->
    <text x="175" y="335" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="160" font-weight="700" fill="url(#goldBright)" text-anchor="middle">T</text>
    
    <!-- Ampersand in Center -->
    <text x="256" y="325" font-family="'Georgia', 'Cinzel', serif" font-size="105" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">&amp;</text>
    
    <!-- Second 'T' (Tanmoy) -->
    <text x="337" y="335" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="160" font-weight="700" fill="url(#goldBright)" text-anchor="middle">T</text>
  </g>

  <!-- Auspicious Inscription Pill -->
  <g filter="url(#subtleShadow)">
    <rect x="186" y="372" width="140" height="20" rx="10" fill="#1b2a40" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="256" y="386" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="10" font-weight="700" fill="#f7e199" letter-spacing="3">KOLKATA</text>
  </g>

  <!-- Sparkle Highlights -->
  <path d="M120,130 L122,122 L130,120 L122,118 L120,110 L118,118 L110,120 L118,122 Z" fill="#ffffff" opacity="0.85" />
  <path d="M390,135 L392,128 L400,126 L392,124 L390,116 L388,124 L380,126 L388,128 Z" fill="#ffffff" opacity="0.85" />
</svg>
